# Render Blueprint for the SI-PALMS / Secure Document project.
# Configure MYSQL_* environment variables in the Render dashboard using an
# externally hosted MySQL-compatible database. Render does not provide MySQL.
services:
  - type: web
    name: secure-document-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: sipalms_db
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: secure-document-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
