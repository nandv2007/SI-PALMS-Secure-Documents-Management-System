services:
  # =======================================================
  # SI-PALMS: Secure Documents Management System
  # Full-Stack Web Service (FastAPI Backend + React SPA)
  # =======================================================
  - type: web
    name: secure-documents-system
    runtime: python
    plan: free
    region: oregon # or frankfurt, ohio, singapore
    buildCommand: "npm install && npm run build && pip install -r server/requirements.txt"
    startCommand: "uvicorn server.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: 3306
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: sipalms_db
      - key: MYSQL_SSL_MODE
        value: "false"
